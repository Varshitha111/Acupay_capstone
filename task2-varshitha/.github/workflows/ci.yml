name: CI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AcuPay_Capstone.Tests/AcuPay_Capstone.Tests.csproj

      - name: Build
        run: dotnet build AcuPay_Capstone.Tests/AcuPay_Capstone.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test AcuPay_Capstone.Tests/AcuPay_Capstone.Tests.csproj --configuration Release --no-build
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}
